 const u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const raw=u(D),key=await crypto.subtle.importKey('raw',u(k),'AES-GCM',false,['decrypt']);

 const page=new TextDecoder().decode(out);
 if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));
 history.replaceState(null,'',location.pathname+'#/');
 document.open();document.write(page);document.close();
